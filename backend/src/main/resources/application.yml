spring:
  application:
    name: ai-testpilot-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
  tomcat:
    # When a client uploads a file exceeding spring.servlet.multipart.max-file-size, Tomcat
    # rejects it, but by default only "swallows" up to 2MB of the remaining request body
    # before giving up and resetting the TCP connection outright — which manifests to
    # browsers as a bare "net::ERR_CONNECTION_RESET" / Network Error with no HTTP response
    # at all, instead of the clean 413 JSON error the app actually returns. Raising this well
    # above the multipart limit lets Tomcat drain the oversized body and reply gracefully.
    max-swallow-size: 150MB

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

# Application-specific configuration (bound via app.* @ConfigurationProperties)
app:
  storage:
    root-dir: ${STORAGE_ROOT_DIR:./storage}
    uploads-dir: uploads
    extracted-dir: extracted
    reports-dir: reports
  upload:
    # Chunked/resumable upload pipeline (com.testforge.backend.upload). Chunk size is decided
    # server-side; large projects are uploaded as many small chunks instead of one giant request,
    # sidestepping the Tomcat/browser large-body issues the single-shot endpoint has (see
    # server.tomcat.max-swallow-size above) and enabling real progress reporting + resumability.
    chunk-size-bytes: ${UPLOAD_CHUNK_SIZE_BYTES:5242880}                    # 5MB per chunk
    max-total-size-bytes: ${UPLOAD_MAX_TOTAL_SIZE_BYTES:2147483648}         # 2GB max archive size
    max-extracted-size-bytes: ${UPLOAD_MAX_EXTRACTED_SIZE_BYTES:4294967296} # 4GB zip-bomb guard (post build-artifact skip)
    session-ttl-minutes: ${UPLOAD_SESSION_TTL_MINUTES:720}                  # 12h before an incomplete session is purged
  jwt:
    secret: ${JWT_SECRET:dev-only-insecure-secret-change-me-please-32chars-min}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:3600000}      # 1 hour
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 days
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  ai:
    provider: ${AI_PROVIDER:mock} # gemini | mock
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-2.0-flash}
      base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
      timeout-seconds: 60

logging:
  level:
    com.testforge.backend: INFO

---
# Local/dev profile: in-memory H2 database so the project runs without a MySQL
# server installed. Switch to the default profile (or set SPRING_PROFILES_ACTIVE=mysql)
# for real MySQL 8, as documented in the README.
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:mem:testpilot;MODE=MySQL;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

---
# MySQL profile — the primary/production datastore for AI TestPilot.
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ai_testpilot?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect
